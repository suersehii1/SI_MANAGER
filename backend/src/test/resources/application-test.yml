spring:
  datasource:
    url: jdbc:h2:mem:sipm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    # 운영 마이그레이션 + 테스트 전용 샘플 데이터(V900)
    locations: classpath:db/migration,classpath:db/testdata
app:
  storage:
    root: ${java.io.tmpdir}/sipm-test-uploads
