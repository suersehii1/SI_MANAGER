server:
  port: 8080
  tomcat:
    max-swallow-size: 20MB
    # 동시에 처리하는 요청 수 (Spring Boot 기본값과 같지만 명시). 넘치는 요청은 accept-count만큼 줄을 선다
    threads:
      max: ${SERVER_MAX_THREADS:200}
      min-spare: 10
    accept-count: 100
spring:
  application:
    name: sipm-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sipm}
    username: ${SPRING_DATASOURCE_USERNAME:sipm}
    password: ${SPRING_DATASOURCE_PASSWORD:sipm}
    # 커넥션 풀(HikariCP): DB 연결을 미리 만들어 두고 요청마다 빌려 쓰고 돌려받는다.
    # 모든 값은 환경변수로 바꿀 수 있다 → docker-compose.yml 의 backend.environment 에서 숫자만 고치고
    # 백엔드를 재시작하면 반영된다 (다시 빌드할 필요 없음). 아래 ${이름:값} 의 값은 환경변수가 없을 때의 기본값.
    # 기준: 사내 시스템 동시 사용자 50명 안팎. PostgreSQL 기본 최대 연결(100개) 안에서 여유를 둔다.
    hikari:
      pool-name: sipm-db-pool
      maximum-pool-size: ${DB_POOL_MAX:20}                     # 동시에 쓸 수 있는 DB 연결 최대 개수
      minimum-idle: ${DB_POOL_MIN_IDLE:5}                      # 한가할 때도 미리 열어 두는 연결 수
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}  # 연결이 모두 사용 중일 때 기다리는 최대 시간(ms)
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}          # 안 쓰는 여분 연결을 닫기까지 시간(ms) = 10분
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}         # 연결 하나를 쓰는 최대 시간(ms) = 30분, 이후 새로 교체
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}  # 연결을 이 시간(ms) 넘게 붙잡으면 로그 경고
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    secret: ${JWT_SECRET:c2lwbS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMjAyNi0xMC0yMy0hIQ==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  storage:
    root: ${APP_STORAGE_ROOT:/data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
