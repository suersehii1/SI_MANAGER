server:
  port: 8080
  tomcat:
    max-swallow-size: 20MB
spring:
  application:
    name: sipm-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sipm}
    username: ${SPRING_DATASOURCE_USERNAME:sipm}
    password: ${SPRING_DATASOURCE_PASSWORD:sipm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    secret: ${JWT_SECRET:c2lwbS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMjAyNi0xMC0yMy0hIQ==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  storage:
    root: ${APP_STORAGE_ROOT:/data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
