server {
  listen 80;
  client_max_body_size 10m;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # 빌드 결과 파일(JS/CSS/이미지)은 파일 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 오래 캐시해도 안전.
  # 없는 파일(재배포로 지워진 예전 파일)은 index.html로 넘기지 말고 404를 돌려준다.
  # (index.html을 주면 브라우저가 JS 자리에 HTML을 받아 화면 로딩이 조용히 실패한다)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 화면 진입점(index.html)은 항상 최신 여부를 확인 → 재배포 후 새 파일 목록을 바로 받는다
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
